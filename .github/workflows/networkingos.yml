name: Buildroot Full Network TUN/TAP Fast Boot

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential bc bison flex libncurses5-dev libssl-dev \
          libglib2.0-dev ccache libelf-dev rsync cpio unzip wget git

    - name: Download Buildroot LTS
      run: |
        BUILDROOT_VER="2024.02.8"
        wget https://buildroot.org/downloads/buildroot-${BUILDROOT_VER}.tar.gz
        tar -xzf buildroot-${BUILDROOT_VER}.tar.gz
        mv buildroot-${BUILDROOT_VER} buildroot

    - name: Configure Buildroot & Enable /dev/net/tun
      run: |
        cd buildroot
        make qemu_arm_vexpress_defconfig

        # 1. Kernel Fragment untuk aktifkan /dev/net/tun
        echo "CONFIG_TUN=y" > linux.fragment

        # 2. Konfigurasi bersih (tanpa opsi legacy)
        cat << 'EOF' >> .config
        BR2_LINUX_KERNEL_CONFIG_FRAGMENT_FILES="linux.fragment"

        # Optimasi Booting & Init
        BR2_OPTIMIZE_3=y
        BR2_INIT_BUSYBOX=y
        BR2_TARGET_ROOTFS_CPIO=y
        BR2_TARGET_ROOTFS_CPIO_GZIP=y

        # Auto DHCP Network pada Booting
        BR2_SYSTEM_DHCP="eth0"

        # Shell & System Utilities
        BR2_PACKAGE_BUSYBOX_SHOW_OTHERS=y
        BR2_PACKAGE_BASH=y
        BR2_PACKAGE_HTOP=y
        BR2_PACKAGE_NANO=y
        BR2_PACKAGE_TREE=y
        BR2_PACKAGE_TMUX=y

        # Networking Stack & VPN Tools
        BR2_PACKAGE_CA_CERTIFICATES=y
        BR2_PACKAGE_OPENSSL=y
        BR2_PACKAGE_CURL=y
        BR2_PACKAGE_WGET=y
        BR2_PACKAGE_DROPBEAR=y
        BR2_PACKAGE_IPROUTE2=y
        BR2_PACKAGE_IPUTILS=y
        BR2_PACKAGE_IPTABLES=y
        BR2_PACKAGE_NET_TOOLS=y
        BR2_PACKAGE_DNSMASQ=y
        BR2_PACKAGE_SOCAT=y
        BR2_PACKAGE_TCPDUMP=y
        BR2_PACKAGE_IPERF3=y
        BR2_PACKAGE_BRIDGE_UTILS=y
        BR2_PACKAGE_ETHTOOL=y
        EOF

        # Terapkan konfigurasi baru secara aman
        make olddefconfig

    - name: Compile Buildroot
      run: |
        cd buildroot
        make -j$(nproc)

    - name: Upload zImage & rootfs.cpio.gz
      uses: actions/upload-artifact@v4
      with:
        name: buildroot-tun-arm32
        path: |
          buildroot/output/images/zImage
          buildroot/output/images/rootfs.cpio.gz