name: Build Fast-Boot Full-Net zImage ARM32

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex libncurses5-dev rsync unzip bc cpio libssl-dev

      - name: Download Buildroot
        run: |
          BUILDROOT_VER="2024.02.1"
          curl -sL https://buildroot.org/downloads/buildroot-${BUILDROOT_VER}.tar.gz | tar -xz
          mv buildroot-${BUILDROOT_VER} buildroot

      - name: Configure Kernel & Enable DTB
        run: |
          cd buildroot
          make qemu_arm_vexpress_defconfig
          
          # Matikan RootFS bawaan
          sed -i 's/BR2_TARGET_ROOTFS_TAR=y/# BR2_TARGET_ROOTFS_TAR is not set/' .config
          
          # Paksa Buildroot untuk membuat DTB Vexpress
          echo 'BR2_LINUX_KERNEL_DTS_SUPPORT=y' >> .config
          echo 'BR2_LINUX_KERNEL_INTREE_DTS_NAME="vexpress-v2p-ca9"' >> .config
          
          make olddefconfig

          # Suntikkan Konfigurasi Super Cepat + Full Networking ke Kernel
          cat << 'EOF' >> output/build/linux-custom/.config || true
          # === OPTIMASI FAST BOOT ===
          CONFIG_CC_OPTIMIZE_FOR_SIZE=y
          # CONFIG_DEBUG_KERNEL is not set
          # CONFIG_DRM is not set
          # CONFIG_SOUND is not set
          # CONFIG_USB is not set
          # CONFIG_WLAN is not set

          # === FULL NETWORKING & VIRTIO ===
          CONFIG_NET=y
          CONFIG_INET=y
          CONFIG_IPV6=y
          CONFIG_NETFILTER=y
          CONFIG_NF_CONNTRACK=y
          CONFIG_IP_NF_IPTABLES=y
          CONFIG_IP_NF_NAT=y
          CONFIG_IP_NF_TARGET_MASQUERADE=y
          CONFIG_NF_TABLES=y
          CONFIG_BRIDGE=y
          CONFIG_VETH=y
          CONFIG_TUN=y
          CONFIG_IP_ADVANCED_ROUTER=y
          CONFIG_IP_MULTIPLE_TABLES=y
          CONFIG_VIRTIO_NET=y
          EOF

      - name: Compile Kernel zImage
        run: |
          cd buildroot
          make linux -j$(nproc)

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: arm32-virt-zImage
          path: buildroot/output/images/zImage
