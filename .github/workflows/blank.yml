name: Buildroot Full Network TUN/TAP Fast Boot

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential bc bison flex libncurses5-dev libssl-dev \
          libglib2.0-dev ccache libelf-dev rsync cpio unzip wget git

    - name: Download Buildroot LTS
      run: |
        BUILDROOT_VER="2024.02.8"
        wget https://buildroot.org/downloads/buildroot-${BUILDROOT_VER}.tar.gz
        tar -xzf buildroot-${BUILDROOT_VER}.tar.gz
        mv buildroot-${BUILDROOT_VER} buildroot

    - name: Configure Buildroot Safely
      run: |
        cd buildroot
        make qemu_arm_vexpress_defconfig

        # 1. Kernel Fragment (PENTING: devtmpfs mount + /dev/net/tun)
        cat << 'EOF' > linux.fragment
        CONFIG_TUN=y
        CONFIG_DEVTMPFS=y
        CONFIG_DEVTMPFS_MOUNT=y
        EOF

        # 2. Injeksi Konfigurasi Buildroot
        ./utils/config --set-str BR2_LINUX_KERNEL_CONFIG_FRAGMENT_FILES "linux.fragment"
        ./utils/config --enable BR2_ROOTFS_DEVICE_CREATION_DYNAMIC_DEVTMPFS
        ./utils/config --enable BR2_INIT_BUSYBOX
        ./utils/config --enable BR2_TARGET_ROOTFS_CPIO
        ./utils/config --enable BR2_TARGET_ROOTFS_CPIO_GZIP
        ./utils/config --set-str BR2_SYSTEM_DHCP "eth0"
        ./utils/config --set-str BR2_TARGET_GENERIC_GETTY_PORT "ttyAMA0"

        # Utilities
        ./utils/config --enable BR2_PACKAGE_BUSYBOX_SHOW_OTHERS
        ./utils/config --enable BR2_PACKAGE_BASH
        ./utils/config --enable BR2_PACKAGE_HTOP
        ./utils/config --enable BR2_PACKAGE_NANO
        ./utils/config --enable BR2_PACKAGE_TREE
        ./utils/config --enable BR2_PACKAGE_TMUX

        # Networking & VPN Stack
        ./utils/config --enable BR2_PACKAGE_CA_CERTIFICATES
        ./utils/config --enable BR2_PACKAGE_LIBOPENSSL
        ./utils/config --enable BR2_PACKAGE_CURL
        ./utils/config --enable BR2_PACKAGE_WGET
        ./utils/config --enable BR2_PACKAGE_DROPBEAR
        ./utils/config --enable BR2_PACKAGE_IPROUTE2
        ./utils/config --enable BR2_PACKAGE_IPUTILS
        ./utils/config --enable BR2_PACKAGE_IPTABLES
        ./utils/config --enable BR2_PACKAGE_NET_TOOLS
        ./utils/config --enable BR2_PACKAGE_DNSMASQ
        ./utils/config --enable BR2_PACKAGE_SOCAT
        ./utils/config --enable BR2_PACKAGE_TCPDUMP
        ./utils/config --enable BR2_PACKAGE_IPERF3
        ./utils/config --enable BR2_PACKAGE_BRIDGE_UTILS
        ./utils/config --enable BR2_PACKAGE_ETHTOOL

        # 3. Regenerasi .config tanpa legacy
        make olddefconfig
        sed -i '/BR2_LEGACY/d' .config

    - name: Compile Buildroot
      run: |
        cd buildroot
        make -j$(nproc)

    - name: Upload zImage & rootfs.cpio.gz
      uses: actions/upload-artifact@v4
      with:
        name: buildroot-tun-arm32
        path: |
          buildroot/output/images/zImage
          buildroot/output/images/rootfs.cpio.gz
