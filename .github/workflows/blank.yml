name: Build Alpine Virt Kernel (ARMv8L / ARMhf)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build-kernel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Toolchain & Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc-arm-linux-gnueabihf \
            g++-arm-linux-gnueabihf \
            bison flex libncurses-dev libssl-dev libelf-dev bc cpio kmod \
            git wget curl xz-utils lz4

      - name: Fetch Linux Kernel LTS & Alpine Virt Config
        run: |
          KERNEL_VER="6.6.78"
          
          # Unduh Kernel Source LTS
          wget https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-${KERNEL_VER}.tar.xz
          tar -xf linux-${KERNEL_VER}.tar.xz
          mv linux-${KERNEL_VER} kernel-source

          cd kernel-source
          
          # Unduh kernel config resmi Alpine Linux Virt (armhf)
          wget -O .config https://git.alpinelinux.org/aports/plain/main/linux-virt/config-virt.armhf || make ARCH=arm defconfig

      - name: Optimize for Fast Boot, Low RAM (1GB) & Buildroot Features
        run: |
          cd kernel-source

          # 1. Optimasi Ukuran Kernel & Kecepatan Boot
          ./scripts/config --enable CONFIG_CC_OPTIMIZE_FOR_SIZE
          ./scripts/config --enable CONFIG_KERNEL_LZ4
          ./scripts/config --disable CONFIG_DEBUG_KERNEL
          ./scripts/config --disable CONFIG_SLUB_DEBUG
          ./scripts/config --disable CONFIG_FTRACE
          ./scripts/config --disable CONFIG_KALLSYMS_ALL
          ./scripts/config --disable CONFIG_PROVE_LOCKING
          ./scripts/config --disable CONFIG_DRM
          ./scripts/config --disable CONFIG_SOUND

          # 2. Filesystem Built-in (Menghindari delay saat load initramfs)
          ./scripts/config --enable CONFIG_DEVTMPFS
          ./scripts/config --enable CONFIG_DEVTMPFS_MOUNT
          ./scripts/config --enable CONFIG_EXT4_FS
          ./scripts/config --enable CONFIG_SQUASHFS
          ./scripts/config --enable CONFIG_SQUASHFS_LZ4
          ./scripts/config --enable CONFIG_OVERLAY_FS
          ./scripts/config --enable CONFIG_TMPFS
          ./scripts/config --enable CONFIG_TMPFS_POSIX_ACL

          # 3. Fitur Lengkap untuk Buildroot / Container (CGroups & Namespaces)
          ./scripts/config --enable CONFIG_NAMESPACES
          ./scripts/config --enable CONFIG_UTS_NS
          ./scripts/config --enable CONFIG_IPC_NS
          ./scripts/config --enable CONFIG_USER_NS
          ./scripts/config --enable CONFIG_PID_NS
          ./scripts/config --enable CONFIG_NET_NS
          ./scripts/config --enable CONFIG_CGROUPS
          ./scripts/config --enable CONFIG_MEMCG
          ./scripts/config --enable CONFIG_CGROUP_SCHED
          ./scripts/config --enable CONFIG_CGROUP_FREEZER
          ./scripts/config --enable CONFIG_CGROUP_DEVICE
          ./scripts/config --enable CONFIG_CGROUP_CPUACCT
          ./scripts/config --enable CONFIG_CGROUP_BPF

          # 4. Networking & Netfilter (Support IPTables/NFTables untuk Buildroot)
          ./scripts/config --enable CONFIG_NETFILTER
          ./scripts/config --enable CONFIG_IP_NF_IPTABLES
          ./scripts/config --enable CONFIG_IP_NF_FILTER
          ./scripts/config --enable CONFIG_IP_NF_NAT
          ./scripts/config --enable CONFIG_NETFILTER_XT_MARK

          # 5. Drivers VirtIO & Virtualization
          ./scripts/config --enable CONFIG_VIRTIO
          ./scripts/config --enable CONFIG_VIRTIO_PCI
          ./scripts/config --enable CONFIG_VIRTIO_BALLOON
          ./scripts/config --enable CONFIG_VIRTIO_BLK
          ./scripts/config --enable CONFIG_VIRTIO_NET
          ./scripts/config --enable CONFIG_VIRTIO_MMIO

          # Terapkan konfig dan selesaikan dependensi otomatis
          make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- olddefconfig

      - name: Compile Kernel Image & Modules
        run: |
          cd kernel-source
          make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- -j$(nproc) zImage modules dtbs

      - name: Package Output Artifacts
        run: |
          mkdir -p output/modules
          cd kernel-source
          
          # Salin zImage
          cp arch/arm/boot/zImage ../output/
          
          # Install modules ke folder output
          make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- INSTALL_MOD_PATH=../output/modules modules_install

          # Arsipkan hasil build
          cd ../output
          tar -czvf alpine-virt-kernel-armv8l.tar.gz zImage modules/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: alpine-virt-kernel-armv8l
          path: output/alpine-virt-kernel-armv8l.tar.gz