name: Build Full Headless Alpine Kernel (ARMhf 32-bit)

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bash bc binutils bison flex grep \
            libncurses-dev libssl-dev libelf-dev rsync cpio unzip \
            git patch perl tar wget python3 lz4 liblz4-tool \
            gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf

      - name: Download & Extract Buildroot
        run: |
          BUILDROOT_VER="2024.02.1"
          wget -q https://buildroot.org/downloads/buildroot-${BUILDROOT_VER}.tar.gz
          tar -xzf buildroot-${BUILDROOT_VER}.tar.gz
          mv buildroot-${BUILDROOT_VER} buildroot

      - name: Setup Buildroot Base Config
        run: |
          cd buildroot
          make qemu_arm_virt_defconfig
          
          # Konfigurasi CPIO Initramfs Terintegrasi + LZ4
          cat << 'EOF' >> .config
          BR2_TARGET_ROOTFS_CPIO=y
          BR2_TARGET_ROOTFS_CPIO_GZIP=n
          BR2_TARGET_ROOTFS_CPIO_LZ4=y
          BR2_ROOTFS_OVERLAY="../board/custom/overlay"
          
          BR2_LINUX_KERNEL=y
          BR2_LINUX_KERNEL_LATEST_VERSION=y
          BR2_TARGET_ROOTFS_CPIO_BUILTIN=y
          EOF

          make olddefconfig

      - name: Download Official Alpine Config & Inject Full Networking + Strip GUI
        run: |
          cd buildroot
          
          # Unduh Kernel Config Resmi Alpine Linux (virt armhf)
          mkdir -p linux
          wget -q -O linux/alpine_virt.config https://gitlab.alpinelinux.org/alpine/aports/-/raw/master/main/linux-virt/config-virt.armhf || true

          # Injeksi Pengaturan Kernel Kustom
          ./support/kconfig/merge_config.sh -m linux/.config linux/alpine_virt.config << 'EOF'
          # ====================================================================
          # 1. OPTIMASI FAST BOOT & COMPRESSION
          # ====================================================================
          CONFIG_KERNEL_LZ4=y
          CONFIG_RD_LZ4=y
          CONFIG_BOOT_PRINTK_DELAY=n
          CONFIG_QUIET_KERNEL=y

          # ====================================================================
          # 2. FULL ADVANCED NETWORKING, ROUTING, FIREWALL & TUNNELING
          # ====================================================================
          CONFIG_NET=y
          CONFIG_INET=y
          CONFIG_IPV6=y
          CONFIG_NETFILTER=y
          CONFIG_NETFILTER_ADVANCED=y
          CONFIG_BRIDGE=y
          CONFIG_VLAN_8021Q=y
          CONFIG_NET_SCHED=y
          CONFIG_NET_CLS_ACT=y

          # Netfilter / IPTables / NFTables / TPROXY / IPSet (Proxy & Redirection)
          CONFIG_NF_CONNTRACK=y
          CONFIG_NF_NAT=y
          CONFIG_NETFILTER_XT_TARGET_TPROXY=y
          CONFIG_NETFILTER_XT_MATCH_SOCKET=y
          CONFIG_NETFILTER_XT_MATCH_COMMENT=y
          CONFIG_NETFILTER_XT_MATCH_CONNTRACK=y
          CONFIG_NETFILTER_XT_MATCH_IPSET=y
          CONFIG_IP_SET=y
          CONFIG_IP_SET_HASH_IP=y
          CONFIG_IP_SET_HASH_NET=y
          CONFIG_NF_TABLES=y
          CONFIG_NF_TABLES_INET=y
          CONFIG_NFT_NAT=y
          CONFIG_NFT_TPROXY=y
          CONFIG_NFT_COMPAT=y

          # Tunneling & Virtual Interfaces (WireGuard, GRE, VXLAN, TUN/TAP, SIT, VTI)
          CONFIG_TUN=y
          CONFIG_TAP=y
          CONFIG_WIREGUARD=y
          CONFIG_NET_IPGRE=y
          CONFIG_NET_IPGRE_DEMUX=y
          CONFIG_VXLAN=y
          CONFIG_GENEVE=y
          CONFIG_IPV6_SIT=y
          CONFIG_IPV6_TUNNEL=y
          CONFIG_NET_FOU=y
          CONFIG_NET_IPIP=y
          CONFIG_NET_UDP_TUNNEL=y

          # Advanced Routing & Congestion Control (BBR, Policy Routing)
          CONFIG_IP_ADVANCED_ROUTER=y
          CONFIG_IP_MULTIPLE_TABLES=y
          CONFIG_IP_ROUTE_MULTIPATH=y
          CONFIG_IP_ROUTE_VERBOSE=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_DEFAULT_BBR=y
          CONFIG_NET_MPTCP=y

          # eBPF, Socket Filtering & Crypto Acceleration
          CONFIG_BPF=y
          CONFIG_BPF_SYSCALL=y
          CONFIG_BPF_JIT=y
          CONFIG_NET_CLS_BPF=y
          CONFIG_NET_ACT_BPF=y
          CONFIG_CRYPTO_AES=y
          CONFIG_CRYPTO_CHACHA20POLY1305=y
          CONFIG_CRYPTO_SHA256=y
          CONFIG_CRYPTO_SHA512=y

          # ====================================================================
          # 3. FULL CONTAINER & VIRTUALIZATION SUPPORT (Docker/LXC/cgroups)
          # ====================================================================
          CONFIG_CGROUPS=y
          CONFIG_MEMCG=y
          CONFIG_BLK_CGROUP=y
          CONFIG_CGROUP_SCHED=y
          CONFIG_CGROUP_FREEZER=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_CGROUP_CPUACCT=y
          CONFIG_CGROUP_BPF=y
          CONFIG_NAMESPACES=y
          CONFIG_UTS_NS=y
          CONFIG_IPC_NS=y
          CONFIG_USER_NS=y
          CONFIG_PID_NS=y
          CONFIG_NET_NS=y
          CONFIG_SECCOMP=y
          CONFIG_OVERLAY_FS=y

          # ====================================================================
          # 4. STORAGE & VIRTIO DRIVERS (VirtFS / 9P SharedFS)
          # ====================================================================
          CONFIG_NET_9P=y
          CONFIG_NET_9P_VIRTIO=y
          CONFIG_9P_FS=y
          CONFIG_9P_FS_POSIX_ACL=y
          CONFIG_9P_FS_SECURITY=y
          CONFIG_VIRTIO=y
          CONFIG_VIRTIO_PCI=y
          CONFIG_VIRTIO_MMIO=y
          CONFIG_VIRTIO_BLK=y
          CONFIG_VIRTIO_NET=y
          CONFIG_VIRTIO_CONSOLE=y
          CONFIG_EXT4_FS=y
          CONFIG_F2FS_FS=y
          CONFIG_SQUASHFS=y
          CONFIG_VFAT_FS=y
          CONFIG_EXFAT_FS=y

          # ====================================================================
          # 5. MATIKAN TOTAL SELURUH GRAFIS, SOUND, DISPLAY, DAN MEDIA (STRIPPED)
          # ====================================================================
          CONFIG_DRM=n
          CONFIG_FB=n
          CONFIG_FRAMEBUFFER_CONSOLE=n
          CONFIG_SOUND=n
          CONFIG_SND=n
          CONFIG_MEDIA_SUPPORT=n
          CONFIG_MEDIA_CAMERA_SUPPORT=n
          CONFIG_DRM_AMDGPU=n
          CONFIG_DRM_NOUVEAU=n
          CONFIG_DRM_I915=n
          CONFIG_DRM_RADEON=n
          CONFIG_AGP=n
          CONFIG_VGA_CONSOLE=n
          CONFIG_LOGO=n
          CONFIG_BACKLIGHT_CLASS_DEVICE=n
          CONFIG_INPUT_JOYSTICK=n
          CONFIG_INPUT_TOUCHSCREEN=n
          EOF
          
          make linux-rebuild

      - name: Build Kernel Image
        run: |
          cd buildroot
          make -j$(nproc)

      - name: Collect Artifacts
        run: |
          mkdir -p output_artifacts
          cp buildroot/output/images/zImage output_artifacts/ 2>/dev/null || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: armhf-headless-alpine-kernel
          path: output_artifacts/