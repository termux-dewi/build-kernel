name: Build Full Headless Alpine Kernel (ARMhf 32-bit)

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. WAJIB: Install seluruh dependensi host Buildroot di runner Ubuntu
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bash \
            bc \
            binutils \
            bison \
            bzip2 \
            cpio \
            flex \
            g++ \
            gcc \
            git \
            gzip \
            libncurses-dev \
            libssl-dev \
            make \
            patch \
            perl \
            python3 \
            rsync \
            tar \
            unzip \
            wget \
            pahole

      # 2. Setup Buildroot
      - name: Setup Buildroot
        run: |
          git clone --depth=1 https://github.com/buildroot/buildroot.git buildroot

      # 3. Prepare Config
      - name: Prepare Kernel Config & Buildroot Config
        run: |
          cd buildroot
          make qemu_arm_vexpress_defconfig

          KCONFIG_DIR="$(pwd)/../kernel_config"
          mkdir -p "$KCONFIG_DIR"

          cat << 'EOF' > "$KCONFIG_DIR/headless_fragment.config"
          CONFIG_KERNEL_LZ4=y
          CONFIG_RD_LZ4=y
          CONFIG_NET=y
          CONFIG_INET=y
          CONFIG_IPV6=y
          CONFIG_NETFILTER=y
          CONFIG_TUN=y
          CONFIG_TAP=y
          CONFIG_WIREGUARD=y
          CONFIG_CGROUPS=y
          CONFIG_NAMESPACES=y
          CONFIG_OVERLAY_FS=y
          CONFIG_NET_9P=y
          CONFIG_NET_9P_VIRTIO=y
          CONFIG_9P_FS=y
          CONFIG_VIRTIO=y
          CONFIG_VIRTIO_PCI=y
          CONFIG_VIRTIO_NET=y
          EOF

          cat << EOF >> .config
          BR2_TARGET_ROOTFS_CPIO=y
          BR2_TARGET_ROOTFS_CPIO_LZ4=y
          BR2_ROOTFS_OVERLAY="../board/custom/overlay"

          BR2_LINUX_KERNEL=y
          BR2_LINUX_KERNEL_LATEST_VERSION=y
          BR2_LINUX_KERNEL_USE_DEFCONFIG=y
          BR2_LINUX_KERNEL_DEFCONFIG="multi_v7"
          BR2_LINUX_KERNEL_CONFIG_FRAGMENTS="$KCONFIG_DIR/headless_fragment.config"
          BR2_TARGET_ROOTFS_CPIO_BUILTIN=y
          EOF

          make olddefconfig

      # 4. Build dengan Auto-Diagnostic Log jika Exit Code 2 terjadi lagi
      - name: Build Kernel & RootFS
        run: |
          cd buildroot
          echo "[*] Compiling Kernel & RootFS..."
          make -j$(nproc) > build.log 2>&1 || {
            EXIT_CODE=$?
            echo "=================================================="
            echo " BUILD FAILED (Exit Code $EXIT_CODE)! LAST 100 LINES LOG: "
            echo "=================================================="
            tail -n 100 build.log
            exit $EXIT_CODE
          }
          echo "[*] Build Selesai Berhasil!"