name: Build Custom Headless Kernel & RootFS

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bash \
            bc \
            binutils \
            bison \
            bzip2 \
            cpio \
            flex \
            g++ \
            gcc \
            git \
            gzip \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            make \
            patch \
            perl \
            python3 \
            rsync \
            tar \
            unzip \
            wget \
            pahole

      - name: Setup Buildroot
        run: |
          git clone --depth=1 https://github.com/buildroot/buildroot.git buildroot

      - name: Prepare Kernel Config & Buildroot Config
        run: |
          cd buildroot
          
          # 1. Target QEMU ARM 32-bit dasar
          make qemu_arm_vexpress_defconfig

          # 2. Folder penyimpanan Kconfig Fragment (Absolute Path)
          KCONFIG_DIR="$(pwd)/../kernel_config"
          mkdir -p "$KCONFIG_DIR"

          # 3. Buat Kconfig Fragment Headless
          cat << 'EOF' > "$KCONFIG_DIR/headless_fragment.config"
          # Fast Boot & LZ4
          CONFIG_KERNEL_LZ4=y
          CONFIG_RD_LZ4=y
          CONFIG_BOOT_PRINTK_DELAY=n
          CONFIG_QUIET_KERNEL=y

          # Networking & Netfilter / Proxy / TPROXY / IPSet
          CONFIG_NET=y
          CONFIG_INET=y
          CONFIG_IPV6=y
          CONFIG_NETFILTER=y
          CONFIG_NETFILTER_ADVANCED=y
          CONFIG_BRIDGE=y
          CONFIG_VLAN_8021Q=y
          CONFIG_NET_SCHED=y
          CONFIG_NET_CLS_ACT=y

          CONFIG_NF_CONNTRACK=y
          CONFIG_NF_NAT=y
          CONFIG_NETFILTER_XT_TARGET_TPROXY=y
          CONFIG_NETFILTER_XT_MATCH_SOCKET=y
          CONFIG_NETFILTER_XT_MATCH_COMMENT=y
          CONFIG_NETFILTER_XT_MATCH_CONNTRACK=y
          CONFIG_NETFILTER_XT_MATCH_IPSET=y
          CONFIG_IP_SET=y
          CONFIG_IP_SET_HASH_IP=y
          CONFIG_IP_SET_HASH_NET=y
          CONFIG_NF_TABLES=y
          CONFIG_NF_TABLES_INET=y
          CONFIG_NFT_NAT=y
          CONFIG_NFT_TPROXY=y
          CONFIG_NFT_COMPAT=y

          # Tunneling & VPN
          CONFIG_TUN=y
          CONFIG_TAP=y
          CONFIG_WIREGUARD=y
          CONFIG_NET_IPGRE=y
          CONFIG_NET_IPGRE_DEMUX=y
          CONFIG_VXLAN=y
          CONFIG_GENEVE=y
          CONFIG_IPV6_SIT=y
          CONFIG_IPV6_TUNNEL=y
          CONFIG_NET_FOU=y
          CONFIG_NET_IPIP=y
          CONFIG_NET_UDP_TUNNEL=y

          # Routing & Congestion Control
          CONFIG_IP_ADVANCED_ROUTER=y
          CONFIG_IP_MULTIPLE_TABLES=y
          CONFIG_IP_ROUTE_MULTIPATH=y
          CONFIG_IP_ROUTE_VERBOSE=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_DEFAULT_BBR=y
          CONFIG_NET_MPTCP=y

          # eBPF & Crypto
          CONFIG_BPF=y
          CONFIG_BPF_SYSCALL=y
          CONFIG_BPF_JIT=y
          CONFIG_NET_CLS_BPF=y
          CONFIG_NET_ACT_BPF=y
          CONFIG_CRYPTO_AES=y
          CONFIG_CRYPTO_CHACHA20POLY1305=y
          CONFIG_CRYPTO_SHA256=y
          CONFIG_CRYPTO_SHA512=y

          # Containers & Docker
          CONFIG_CGROUPS=y
          CONFIG_MEMCG=y
          CONFIG_BLK_CGROUP=y
          CONFIG_CGROUP_SCHED=y
          CONFIG_CGROUP_FREEZER=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_CGROUP_CPUACCT=y
          CONFIG_CGROUP_BPF=y
          CONFIG_NAMESPACES=y
          CONFIG_UTS_NS=y
          CONFIG_IPC_NS=y
          CONFIG_USER_NS=y
          CONFIG_PID_NS=y
          CONFIG_NET_NS=y
          CONFIG_SECCOMP=y
          CONFIG_OVERLAY_FS=y

          # Storage & VirtIO (9P SharedFS)
          CONFIG_NET_9P=y
          CONFIG_NET_9P_VIRTIO=y
          CONFIG_9P_FS=y
          CONFIG_9P_FS_POSIX_ACL=y
          CONFIG_9P_FS_SECURITY=y
          CONFIG_VIRTIO=y
          CONFIG_VIRTIO_PCI=y
          CONFIG_VIRTIO_MMIO=y
          CONFIG_VIRTIO_BLK=y
          CONFIG_VIRTIO_NET=y
          CONFIG_VIRTIO_CONSOLE=y
          CONFIG_EXT4_FS=y
          CONFIG_F2FS_FS=y
          CONFIG_SQUASHFS=y
          CONFIG_VFAT_FS=y
          CONFIG_EXFAT_FS=y

          # Strip Display, GUI, Sound & Media
          CONFIG_DRM=n
          CONFIG_FB=n
          CONFIG_FRAMEBUFFER_CONSOLE=n
          CONFIG_SOUND=n
          CONFIG_SND=n
          CONFIG_MEDIA_SUPPORT=n
          CONFIG_MEDIA_CAMERA_SUPPORT=n
          CONFIG_LOGO=n
          EOF

          # 4. Inject Konfigurasi ke .config Buildroot
          cat << EOF >> .config
          BR2_TARGET_ROOTFS_CPIO=y
          BR2_TARGET_ROOTFS_CPIO_GZIP=n
          BR2_TARGET_ROOTFS_CPIO_LZ4=y
          BR2_ROOTFS_OVERLAY="../board/custom/overlay"

          BR2_LINUX_KERNEL=y
          BR2_LINUX_KERNEL_LATEST_VERSION=y
          BR2_LINUX_KERNEL_USE_DEFCONFIG=y
          BR2_LINUX_KERNEL_DEFCONFIG="multi_v7"
          BR2_LINUX_KERNEL_CONFIG_FRAGMENTS="$KCONFIG_DIR/headless_fragment.config"
          BR2_TARGET_ROOTFS_CPIO_BUILTIN=y
          EOF

          make olddefconfig

      - name: Build Kernel & RootFS
        run: |
          cd buildroot
          echo "[*] Compiling Kernel & RootFS..."
          make -j$(nproc) > build.log 2>&1 || {
            EXIT_CODE=$?
            echo "=================================================="
            echo " BUILD FAILED (Exit Code $EXIT_CODE)! LAST 100 LINES LOG: "
            echo "=================================================="
            tail -n 100 build.log
            exit $EXIT_CODE
          }
          echo "[*] Build Selesai Berhasil!"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: compiled-kernel-and-rootfs
          path: |
            buildroot/output/images/zImage
            buildroot/output/images/*.dtb
            buildroot/output/images/rootfs.cpio*