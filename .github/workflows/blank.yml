name: Build Full Headless Alpine Kernel (ARMhf 32-bit)

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bash bc binutils bison flex grep \
            libncurses-dev libssl-dev libelf-dev rsync cpio unzip \
            git patch perl tar wget python3 lz4 liblz4-tool \
            gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf

      - name: Download Buildroot
        run: |
          BUILDROOT_VER="2024.02.1"
          wget -q https://buildroot.org/downloads/buildroot-${BUILDROOT_VER}.tar.gz
          tar -xzf buildroot-${BUILDROOT_VER}.tar.gz
          mv buildroot-${BUILDROOT_VER} buildroot

      - name: Prepare Kernel Config & Buildroot Config
        run: |
          cd buildroot
          
          # 1. Target QEMU ARM 32-bit dasar di Buildroot
          make qemu_arm_vexpress_defconfig

          # 2. Buat folder untuk Kconfig Fragment (Tanpa download external URL)
          KCONFIG_DIR="$(pwd)/../kernel_config"
          mkdir -p "$KCONFIG_DIR"

          # 3. Buat Kconfig Fragment Headless Lengkap (Networking, Tunneling, Crypto, Docker, 9P, Strip GUI)
          cat << 'EOF' > "$KCONFIG_DIR/headless_fragment.config"
          # Fast Boot & LZ4
          CONFIG_KERNEL_LZ4=y
          CONFIG_RD_LZ4=y
          CONFIG_BOOT_PRINTK_DELAY=n
          CONFIG_QUIET_KERNEL=y

          # Networking & Proxy (Full Advanced Features)
          CONFIG_NET=y
          CONFIG_INET=y
          CONFIG_IPV6=y
          CONFIG_NETFILTER=y
          CONFIG_NETFILTER_ADVANCED=y
          CONFIG_BRIDGE=y
          CONFIG_VLAN_8021Q=y
          CONFIG_NET_SCHED=y
          CONFIG_NET_CLS_ACT=y

          # Netfilter / IPTables / NFTables / TPROXY / IPSet
          CONFIG_NF_CONNTRACK=y
          CONFIG_NF_NAT=y
          CONFIG_NETFILTER_XT_TARGET_TPROXY=y
          CONFIG_NETFILTER_XT_MATCH_SOCKET=y
          CONFIG_NETFILTER_XT_MATCH_COMMENT=y
          CONFIG_NETFILTER_XT_MATCH_CONNTRACK=y
          CONFIG_NETFILTER_XT_MATCH_IPSET=y
          CONFIG_IP_SET=y
          CONFIG_IP_SET_HASH_IP=y
          CONFIG_IP_SET_HASH_NET=y
          CONFIG_NF_TABLES=y
          CONFIG_NF_TABLES_INET=y
          CONFIG_NFT_NAT=y
          CONFIG_NFT_TPROXY=y
          CONFIG_NFT_COMPAT=y

          # Tunneling & VPN (WireGuard, GRE, VXLAN, TUN/TAP, SIT, IPIP)
          CONFIG_TUN=y
          CONFIG_TAP=y
          CONFIG_WIREGUARD=y
          CONFIG_NET_IPGRE=y
          CONFIG_NET_IPGRE_DEMUX=y
          CONFIG_VXLAN=y
          CONFIG_GENEVE=y
          CONFIG_IPV6_SIT=y
          CONFIG_IPV6_TUNNEL=y
          CONFIG_NET_FOU=y
          CONFIG_NET_IPIP=y
          CONFIG_NET_UDP_TUNNEL=y

          # Routing & Congestion Control (BBR, Policy Routing, MPTCP)
          CONFIG_IP_ADVANCED_ROUTER=y
          CONFIG_IP_MULTIPLE_TABLES=y
          CONFIG_IP_ROUTE_MULTIPATH=y
          CONFIG_IP_ROUTE_VERBOSE=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_DEFAULT_BBR=y
          CONFIG_NET_MPTCP=y

          # eBPF & Crypto
          CONFIG_BPF=y
          CONFIG_BPF_SYSCALL=y
          CONFIG_BPF_JIT=y
          CONFIG_NET_CLS_BPF=y
          CONFIG_NET_ACT_BPF=y
          CONFIG_CRYPTO_AES=y
          CONFIG_CRYPTO_CHACHA20POLY1305=y
          CONFIG_CRYPTO_SHA256=y
          CONFIG_CRYPTO_SHA512=y

          # Containers / Docker / CGroups / Namespaces
          CONFIG_CGROUPS=y
          CONFIG_MEMCG=y
          CONFIG_BLK_CGROUP=y
          CONFIG_CGROUP_SCHED=y
          CONFIG_CGROUP_FREEZER=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_CGROUP_CPUACCT=y
          CONFIG_CGROUP_BPF=y
          CONFIG_NAMESPACES=y
          CONFIG_UTS_NS=y
          CONFIG_IPC_NS=y
          CONFIG_USER_NS=y
          CONFIG_PID_NS=y
          CONFIG_NET_NS=y
          CONFIG_SECCOMP=y
          CONFIG_OVERLAY_FS=y

          # Storage & VirtIO (9P SharedFS untuk Termux Host)
          CONFIG_NET_9P=y
          CONFIG_NET_9P_VIRTIO=y
          CONFIG_9P_FS=y
          CONFIG_9P_FS_POSIX_ACL=y
          CONFIG_9P_FS_SECURITY=y
          CONFIG_VIRTIO=y
          CONFIG_VIRTIO_PCI=y
          CONFIG_VIRTIO_MMIO=y
          CONFIG_VIRTIO_BLK=y
          CONFIG_VIRTIO_NET=y
          CONFIG_VIRTIO_CONSOLE=y
          CONFIG_EXT4_FS=y
          CONFIG_F2FS_FS=y
          CONFIG_SQUASHFS=y
          CONFIG_VFAT_FS=y
          CONFIG_EXFAT_FS=y

          # Strip GUI, Display, Framebuffer, Sound & Media Total
          CONFIG_DRM=n
          CONFIG_FB=n
          CONFIG_FRAMEBUFFER_CONSOLE=n
          CONFIG_SOUND=n
          CONFIG_SND=n
          CONFIG_MEDIA_SUPPORT=n
          CONFIG_MEDIA_CAMERA_SUPPORT=n
          CONFIG_LOGO=n
          EOF

          # 4. Hubungkan Defconfig ARMv7 standar + Fragment langsung ke Buildroot
          cat << EOF >> .config
          BR2_TARGET_ROOTFS_CPIO=y
          BR2_TARGET_ROOTFS_CPIO_GZIP=n
          BR2_TARGET_ROOTFS_CPIO_LZ4=y
          BR2_ROOTFS_OVERLAY="../board/custom/overlay"

          BR2_LINUX_KERNEL=y
          BR2_LINUX_KERNEL_LATEST_VERSION=y
          BR2_LINUX_KERNEL_USE_DEFCONFIG=y
          BR2_LINUX_KERNEL_DEFCONFIG="multi_v7"
          BR2_LINUX_KERNEL_CONFIG_FRAGMENTS="$KCONFIG_DIR/headless_fragment.config"
          BR2_TARGET_ROOTFS_CPIO_BUILTIN=y
          EOF

          make olddefconfig

      - name: Build Kernel & RootFS
        run: |
          cd buildroot
          make -j$(nproc)

      - name: Collect Artifacts
        run: |
          mkdir -p output_artifacts
          cp buildroot/output/images/zImage output_artifacts/ 2>/dev/null || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: armhf-headless-alpine-kernel
          path: output_artifacts/