name: Build Void Linux 9pfs SharedFS

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/rootfs.yml'

jobs:
  build-void-sharedfs:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare Void RootFS for 9pfs
        run: |
          # 1. Unduh Void Linux ARMv7l Musl
          VOID_URL=$(curl -s https://repo-default.voidlinux.org/live/current/ | grep -oP 'void-armv7l-musl-ROOTFS-\d+\.tar\.xz' | head -n 1)
          wget -q "https://repo-default.voidlinux.org/live/current/$VOID_URL" -O void-rootfs.tar.xz

          # 2. Ekstrak ke folder temporary
          mkdir -p rootfs
          sudo tar -xf void-rootfs.tar.xz -C rootfs

          # 3. Hapus device node statis di /dev (agar aman diekstrak di Termux non-root)
          sudo rm -rf rootfs/dev/*

          # 4. Injeksi DNS Resolv & Skrip /init
          sudo bash -c 'echo "nameserver 1.1.1.1" > rootfs/etc/resolv.conf'

          sudo bash -c 'cat << "EOF" > rootfs/init
          #!/bin/sh
          mountpoint -q /proc || mount -t proc proc /proc
          mountpoint -q /sys || mount -t sysfs sysfs /sys
          mountpoint -q /dev || mount -t devtmpfs devtmpfs /dev

          # Auto-create TUN/TAP device node
          if [ ! -e /dev/net/tun ]; then
              mkdir -p /dev/net
              mknod /dev/net/tun c 10 200
              chmod 0666 /dev/net/tun
          fi

          # Aktifkan Loopback & Ethernet
          ip link set lo up
          ip link set eth0 up 2>/dev/null

          # Otomatisasi DHCP
          if command -v dhcpcd >/dev/null 2>&1; then
              dhcpcd eth0 >/dev/null 2>&1 &
          elif command -v udhcpc >/dev/null 2>&1; then
              udhcpc -i eth0 -b >/dev/null 2>&1
          fi

          echo "=========================================="
          echo " Void Linux ARMv7l (9pfs SharedFS) Ready! "
          echo "=========================================="

          exec setsid cttyhack /bin/sh 2>/dev/null || exec /bin/sh
          EOF'

          sudo chmod +x rootfs/init

          # 5. Pack ulang ke tar.gz
          cd rootfs
          sudo tar -czf ../void-rootfs-sharedfs.tar.gz .

      - name: Upload SharedFS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: void-rootfs-sharedfs
          path: void-rootfs-sharedfs.tar.gz
